<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="100%" height="100%">
  <defs>
    <!-- Background Office Gradient with Warm Lighting -->
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf2f7"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Warm Light Bokeh Gradients -->
    <radialGradient id="bokehLight1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fef9c3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokehLight2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Skin Tone Gradients for Khushi Mata -->
    <linearGradient id="skinBase" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#fce7df"/>
      <stop offset="50%" stop-color="#f7d4c8"/>
      <stop offset="100%" stop-color="#eec2b4"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2c4b6"/>
      <stop offset="100%" stop-color="#dba495"/>
    </linearGradient>

    <!-- Navy Blazer Gradients -->
    <linearGradient id="navyBlazer" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#1e284a"/>
      <stop offset="80%" stop-color="#151e36"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lapelShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283556"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>

    <!-- Hair Gradients -->
    <linearGradient id="hairBase" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1a141c"/>
      <stop offset="45%" stop-color="#0e0a12"/>
      <stop offset="70%" stop-color="#1e1824"/>
      <stop offset="100%" stop-color="#0a070d"/>
    </linearGradient>
    <linearGradient id="hairSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c2233" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4a3b54" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2c2233" stop-opacity="0"/>
    </linearGradient>

    <!-- White Shirt -->
    <linearGradient id="whiteShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Lips Gradient (Warm berry/rose pink) -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Gold Jewelry Gradient -->
    <linearGradient id="goldJewelry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Office Background (Bright, Clean, Blurred Modern Architecture) -->
  <rect width="1000" height="1500" fill="url(#officeBg)"/>
  
  <!-- Blurred Windows & Office Structures -->
  <g opacity="0.35">
    <rect x="50" y="80" width="180" height="600" fill="#ffffff" opacity="0.6"/>
    <rect x="260" y="60" width="220" height="650" fill="#ffffff" opacity="0.5"/>
    <rect x="740" y="70" width="220" height="640" fill="#ffffff" opacity="0.55"/>
    <!-- Subtle desk & plant silhouettes in background -->
    <path d="M0 650 Q 200 640 400 660 L 400 900 L 0 900 Z" fill="#94a3b8" opacity="0.2"/>
    <path d="M700 660 Q 850 640 1000 650 L 1000 900 L 700 900 Z" fill="#94a3b8" opacity="0.2"/>
    <!-- Blurred Greenery Plant -->
    <circle cx="850" cy="550" r="80" fill="#475569" opacity="0.25"/>
    <circle cx="880" cy="520" r="60" fill="#334155" opacity="0.2"/>
  </g>

  <!-- Bokeh Ambient Ceiling Lights -->
  <circle cx="230" cy="120" r="45" fill="url(#bokehLight1)"/>
  <circle cx="380" cy="90" r="30" fill="url(#bokehLight1)"/>
  <circle cx="160" cy="220" r="35" fill="url(#bokehLight2)"/>
  <circle cx="780" cy="110" r="40" fill="url(#bokehLight1)"/>
  <circle cx="890" cy="190" r="30" fill="url(#bokehLight2)"/>

  <!-- ================= PERSON: KHUSHI MATA ================= -->

  <!-- Back Hair Silhouette -->
  <g id="backHair">
    <path d="M280 450 C240 260 320 180 500 170 C680 180 760 260 720 450 C760 550 820 720 830 890 C830 1020 780 1100 750 1140 C730 1050 720 880 710 760 C680 580 690 480 660 400 C620 440 600 480 580 480 C500 480 420 440 340 400 C310 480 320 580 290 760 C280 880 270 1050 250 1140 C220 1100 170 1020 170 890 C180 720 240 550 280 450 Z" fill="url(#hairBase)"/>
  </g>

  <!-- Shoulders & Upper Body Silhouette (Navy Blazer Back/Base) -->
  <path d="M210 750 C180 770 130 820 90 920 C50 1020 40 1200 30 1500 L970 1500 C960 1200 950 1020 910 920 C870 820 820 770 790 750 C700 710 630 680 500 680 C370 680 300 710 210 750 Z" fill="url(#navyBlazer)"/>

  <!-- White Collared Dress Shirt -->
  <g id="whiteShirtGroup">
    <!-- Shirt Body Chest Base -->
    <polygon points="440,630 560,630 550,950 450,950" fill="url(#whiteShirt)"/>
    <!-- Center Placket & Seam -->
    <line x1="500" y1="630" x2="500" y2="950" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="500" cy="740" r="4" fill="#94a3b8"/>
    <circle cx="500" cy="810" r="4" fill="#94a3b8"/>
    <circle cx="500" cy="880" r="4" fill="#94a3b8"/>

    <!-- Left Shirt Collar Wing -->
    <path d="M430 600 L410 750 L465 770 L480 650 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Right Shirt Collar Wing -->
    <path d="M570 600 L590 750 L535 770 L520 650 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Neck & Decolletage -->
  <g id="neck">
    <path d="M440 480 C440 560 445 640 455 680 C470 715 500 725 500 725 C500 725 530 715 545 680 C555 640 560 560 560 480 Z" fill="url(#skinBase)"/>
    <!-- Neck contour shadow under chin -->
    <path d="M445 490 Q500 535 555 490 C550 540 530 565 500 565 C470 565 450 540 445 490 Z" fill="url(#skinShadow)" opacity="0.6"/>
    <!-- Delicate clavicle line -->
    <path d="M465 675 Q495 685 535 675" stroke="#eec2b4" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Head & Face Base -->
  <g id="face">
    <!-- Oval feminine jawline matching photo -->
    <path d="M380 340 C370 410 395 500 500 500 C605 500 630 410 620 340 C615 250 580 200 500 200 C420 200 385 250 380 340 Z" fill="url(#skinBase)"/>
    
    <!-- Cheek Blush (Soft Pink Glow) -->
    <ellipse cx="430" cy="385" rx="35" ry="25" fill="#f43f5e" opacity="0.12"/>
    <ellipse cx="570" cy="385" rx="35" ry="25" fill="#f43f5e" opacity="0.12"/>

    <!-- Chin soft contour -->
    <path d="M475 470 Q500 485 525 470" stroke="#dba495" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Facial Features (Khushi Mata) -->
  <g id="facialFeatures">
    <!-- Eyebrows: Neatly groomed black/espresso arches -->
    <path d="M405 285 Q440 270 468 288" stroke="#1c1322" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M595 285 Q560 270 532 288" stroke="#1c1322" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Left Eye -->
    <g transform="translate(415, 305)">
      <!-- Sclera -->
      <path d="M0 10 Q25 -6 50 10 Q25 22 0 10 Z" fill="#ffffff"/>
      <!-- Iris (Dark Brown) -->
      <circle cx="26" cy="10" r="10" fill="#3b2318"/>
      <circle cx="26" cy="10" r="5" fill="#0f0704"/>
      <!-- Catchlight -->
      <circle cx="29" cy="8" r="2.5" fill="#ffffff"/>
      <!-- Eyeliner & Eyelashes -->
      <path d="M-3 10 Q25 -7 53 10" stroke="#170c1a" stroke-width="3" fill="none"/>
      <!-- Subtle under-eye crease -->
      <path d="M5 16 Q25 23 45 16" stroke="#dba495" stroke-width="1.5" fill="none" opacity="0.6"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(535, 305)">
      <!-- Sclera -->
      <path d="M0 10 Q25 -6 50 10 Q25 22 0 10 Z" fill="#ffffff"/>
      <!-- Iris (Dark Brown) -->
      <circle cx="24" cy="10" r="10" fill="#3b2318"/>
      <circle cx="24" cy="10" r="5" fill="#0f0704"/>
      <!-- Catchlight -->
      <circle cx="27" cy="8" r="2.5" fill="#ffffff"/>
      <!-- Eyeliner & Eyelashes -->
      <path d="M-3 10 Q25 -7 53 10" stroke="#170c1a" stroke-width="3" fill="none"/>
      <!-- Subtle under-eye crease -->
      <path d="M5 16 Q25 23 45 16" stroke="#dba495" stroke-width="1.5" fill="none" opacity="0.6"/>
    </g>

    <!-- Nose -->
    <g id="nose">
      <!-- Soft bridge shadow -->
      <path d="M495 295 L492 370 Q492 385 500 388 Q508 385 508 370 L505 295" stroke="#dba495" stroke-width="1.5" fill="none" opacity="0.3"/>
      <!-- Nose tip & nostrils -->
      <path d="M485 385 Q500 395 515 385" stroke="#c28272" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M478 382 Q483 388 488 387" stroke="#b47464" stroke-width="2" fill="none"/>
      <path d="M522 382 Q517 388 512 387" stroke="#b47464" stroke-width="2" fill="none"/>
      <!-- Delicate Nose Stud on right side -->
      <circle cx="516" cy="378" r="1.8" fill="#fef08a" stroke="#d97706" stroke-width="0.8"/>
    </g>

    <!-- Philtrum -->
    <path d="M496 392 L496 410 M504 392 L504 410" stroke="#dba495" stroke-width="1" opacity="0.4"/>

    <!-- Lips: Warm Natural Rose/Berry Smile matching photo -->
    <g id="lips" transform="translate(455, 412)">
      <!-- Upper Lip -->
      <path d="M0 12 Q20 3 45 10 Q70 3 90 12 Q45 18 0 12 Z" fill="url(#lipGrad)"/>
      <!-- Lower Lip -->
      <path d="M3 13 Q45 17 87 13 Q45 35 3 13 Z" fill="url(#lipGrad)"/>
      <!-- Lip shine highlight -->
      <ellipse cx="45" cy="22" rx="14" ry="4" fill="#ffffff" opacity="0.4"/>
      <!-- Gentle mouth corner smiles -->
      <path d="M-2 12 Q2 13 8 13" stroke="#831843" stroke-width="1.5" fill="none"/>
      <path d="M92 12 Q88 13 82 13" stroke="#831843" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Dainty Gold Geometric Earrings (Visible by hair parting) -->
    <!-- Left Earring -->
    <g transform="translate(390, 360)">
      <polygon points="0,0 8,16 -8,16" fill="url(#goldJewelry)" stroke="#b45309" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#fef08a"/>
    </g>
    <!-- Right Earring -->
    <g transform="translate(645, 360)">
      <polygon points="0,0 8,16 -8,16" fill="url(#goldJewelry)" stroke="#b45309" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#fef08a"/>
    </g>
  </g>

  <!-- Front Voluminous Wavy Hair (Cascading over shoulders matching photo) -->
  <g id="frontHair">
    <!-- Crown & Parting -->
    <path d="M495 190 Q490 230 480 250 M505 190 Q515 225 525 245" stroke="#120c16" stroke-width="2"/>
    
    <!-- Left Flowing Waves -->
    <path d="M480 210 C410 210 350 250 330 320 C310 400 330 480 300 580 C270 680 220 780 210 880 C200 960 230 1040 280 1080 C320 1100 360 1050 350 960 C340 850 370 780 390 690 C410 590 380 500 400 420 C410 370 420 320 400 270 Z" fill="url(#hairBase)"/>
    <!-- Left Hair Strands & Highlights -->
    <path d="M350 340 Q310 500 330 650 Q350 800 280 980" stroke="#372a40" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M380 380 Q340 550 370 720 Q390 850 330 1010" stroke="#4a3b54" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Right Flowing Waves -->
    <path d="M520 210 C590 210 650 250 670 320 C690 400 670 480 700 580 C730 680 780 780 790 880 C800 960 770 1040 720 1080 C680 1100 640 1050 650 960 C660 850 630 780 610 690 C590 590 620 500 600 420 C590 370 580 320 600 270 Z" fill="url(#hairBase)"/>
    <!-- Right Hair Strands & Highlights -->
    <path d="M650 340 Q690 500 670 650 Q650 800 720 980" stroke="#372a40" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M620 380 Q660 550 630 720 Q610 850 670 1010" stroke="#4a3b54" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Tailored Navy Blazer & Crossed Arms (Exact Pose from Uploaded Photo) -->
  <g id="blazerAndArms">
    <!-- Left Blazer Lapel (Viewer's Left) -->
    <path d="M360 740 L440 680 L440 920 L370 940 Z" fill="url(#lapelShade)" stroke="#111827" stroke-width="1.5"/>
    <path d="M440 680 L410 770 L440 850" stroke="#334155" stroke-width="1.5" fill="none"/>

    <!-- Right Blazer Lapel (Viewer's Right) -->
    <path d="M640 740 L560 680 L560 920 L630 940 Z" fill="url(#lapelShade)" stroke="#111827" stroke-width="1.5"/>
    <path d="M560 680 L590 770 L560 850" stroke="#334155" stroke-width="1.5" fill="none"/>

    <!-- Blazer Torso Overlap -->
    <path d="M370 920 L500 950 L500 1200 L350 1200 Z" fill="url(#navyBlazer)"/>
    <path d="M630 920 L500 950 L500 1200 L650 1200 Z" fill="url(#navyBlazer)"/>

    <!-- ================= CROSSED ARMS ================= -->
    <!-- Right Arm crossed across chest (resting under left arm) -->
    <g id="crossedRightArm">
      <!-- Sleeve -->
      <path d="M120 930 C150 960 240 1080 340 1140 L450 1190 L400 1280 L220 1220 C140 1160 80 1050 70 980 Z" fill="url(#navyBlazer)"/>
      <!-- White cuff edge peeking out -->
      <path d="M250 1240 L310 1260 L305 1280 L245 1260 Z" fill="#ffffff"/>
      <!-- Right hand resting on left elbow/arm -->
      <path d="M620 1100 C640 1110 740 1160 770 1150 C780 1120 760 1090 720 1070 C680 1050 635 1060 620 1100 Z" fill="url(#skinBase)"/>
      <!-- Fingers detail -->
      <path d="M720 1075 Q755 1095 765 1120 M705 1085 Q740 1110 755 1135" stroke="#dba495" stroke-width="2" fill="none"/>
    </g>

    <!-- Left Arm crossed across in front (Viewer's Left, over Right arm) -->
    <g id="crossedLeftArm">
      <!-- Sleeve -->
      <path d="M880 930 C850 960 760 1080 620 1160 L480 1220 L350 1260 C260 1270 200 1260 180 1230 L190 1170 C240 1180 320 1170 420 1130 L600 1060 C750 980 830 940 880 930 Z" fill="url(#navyBlazer)"/>
      <!-- Left Hand resting on right bicep -->
      <path d="M220 1180 C180 1185 120 1180 95 1195 C85 1215 100 1245 140 1255 C180 1260 230 1250 250 1210 Z" fill="url(#skinBase)"/>
      <path d="M125 1195 Q100 1210 110 1230 M150 1200 Q125 1215 130 1240" stroke="#dba495" stroke-width="2" fill="none"/>

      <!-- Blazer Sleeve 3 Buttons (Characteristic detail from photo!) -->
      <g transform="translate(380, 1285)" fill="#0f172a" stroke="#334155" stroke-width="1.5">
        <circle cx="0" cy="0" r="6"/>
        <circle cx="16" cy="0" r="6"/>
        <circle cx="32" cy="0" r="6"/>
      </g>
    </g>
  </g>

  <!-- Bottom Vignette / Gradient Scrim -->
  <rect y="1250" width="1000" height="250" fill="url(#navyBlazer)" opacity="0.85"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="deskBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#120c24"/>
      <stop offset="50%" stop-color="#0a0614"/>
      <stop offset="85%" stop-color="#040208"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Outer Circular Neon Border (Magenta to Cyan) -->
    <linearGradient id="neonRingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="25%" stop-color="#d946ef"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="85%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- AI 3D Gradient -->
    <linearGradient id="aiFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0e7ff"/>
      <stop offset="65%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Khushi Script Gradient -->
    <linearGradient id="khushiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>

    <!-- Pink Glow -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#d946ef" flood-opacity="0.5"/>
    </filter>

    <!-- Outer Ring Intense Glow -->
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="circleClip">
      <circle cx="500" cy="500" r="460"/>
    </clipPath>
  </defs>

  <!-- Deep Black Space -->
  <rect width="1000" height="1000" fill="#030206"/>

  <!-- Clip inner content to circular disc -->
  <g clip-path="url(#circleClip)">
    <!-- Atmospheric Background with Studio Elements -->
    <circle cx="500" cy="500" r="460" fill="url(#deskBg)"/>

    <!-- Ambient Studio Lights in Background (Blurred Bokeh) -->
    <circle cx="780" cy="320" r="30" fill="#f59e0b" opacity="0.35" filter="url(#ringGlow)"/>
    <circle cx="220" cy="280" r="40" fill="#ec4899" opacity="0.2" filter="url(#ringGlow)"/>
    <circle cx="500" cy="200" r="180" fill="#7c3aed" opacity="0.18" filter="url(#ringGlow)"/>

    <!-- Desk Setup Silhouettes in Background -->
    <!-- Left Laptop displaying AI Brain -->
    <g transform="translate(140, 360)" opacity="0.6">
      <!-- Laptop Screen -->
      <rect x="0" y="0" width="130" height="85" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <!-- Glowing Blue Screen Content -->
      <rect x="5" y="5" width="120" height="75" rx="4" fill="#082f49"/>
      <text x="35" y="45" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#38bdf8">AI</text>
      <!-- Brain circuit icon -->
      <circle cx="85" cy="40" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M85 30 L85 50 M75 40 L95 40" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Laptop Base -->
      <path d="M-15 85 L145 85 L135 95 L-5 95 Z" fill="#334155"/>
      <!-- Plant beside laptop -->
      <circle cx="-15" cy="70" r="12" fill="#10b981" opacity="0.4"/>
      <rect x="-20" y="75" width="10" height="15" fill="#e2e8f0" opacity="0.5"/>
    </g>

    <!-- Desk Notebook ("Big Ideas ♡") -->
    <g transform="translate(170, 590)" opacity="0.5">
      <rect x="0" y="0" width="80" height="95" rx="4" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" transform="rotate(-10)"/>
      <text x="15" y="40" font-family="cursive" font-size="14" fill="#f472b6" transform="rotate(-10)">Big</text>
      <text x="10" y="58" font-family="cursive" font-size="13" fill="#f472b6" transform="rotate(-10)">Ideas</text>
      <text x="25" y="75" font-size="12" fill="#ec4899" transform="rotate(-10)">♡</text>
    </g>

    <!-- Right Pencil Mug ("Create Design Edit Repeat ♡") -->
    <g transform="translate(775, 430)" opacity="0.75">
      <!-- Mug -->
      <rect x="0" y="40" width="70" height="90" rx="8" fill="#1e143b" stroke="#7c3aed" stroke-width="1"/>
      <text x="35" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">Create</text>
      <text x="35" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">Design</text>
      <text x="35" y="84" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">Edit</text>
      <text x="35" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">Repeat</text>
      <text x="35" y="112" text-anchor="middle" font-size="10" fill="#f43f5e">♡</text>
      <!-- Pens sticking out -->
      <line x1="15" y1="40" x2="5" y2="10" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="40" x2="25" y2="5" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="45" y1="40" x2="55" y2="8" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="40" x2="70" y2="15" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- ================= CYBERNETIC FEMALE SILHOUETTE (Left Profile) ================= -->
    <g transform="translate(280, 160)">
      <!-- Flowing Cyber Hair with Neon Circuit Strands -->
      <path d="M120 18 C30 20 -20 120 5 210 C15 250 -10 320 -15 360 C5 310 30 280 40 240 C50 190 70 170 110 160 Z" fill="#06b6d4" opacity="0.3" filter="url(#cyanGlow)"/>
      <path d="M100 0 C0 10 -40 100 -20 200 C0 270 50 320 70 380 C50 320 20 280 15 230 C10 170 40 140 100 130 Z" fill="#d946ef" opacity="0.35" filter="url(#pinkGlow)"/>

      <!-- Neon Circuit Traces in Hair -->
      <path d="M100 20 Q 30 50 10 130 Q -5 190 20 250" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#cyanGlow)"/>
      <circle cx="10" cy="130" r="5" fill="#38bdf8" filter="url(#cyanGlow)"/>
      <circle cx="20" cy="250" r="4" fill="#38bdf8" filter="url(#cyanGlow)"/>
      <circle cx="50" cy="80" r="4" fill="#f43f5e" filter="url(#pinkGlow)"/>

      <path d="M80 50 Q 20 100 5 180 Q 0 240 40 290" fill="none" stroke="#ec4899" stroke-width="2.5" filter="url(#pinkGlow)"/>

      <!-- Glowing Face Profile -->
      <path d="M70 120 C60 145 35 155 35 170 C35 180 45 185 45 192 C45 200 35 205 38 215 C42 225 60 235 65 245 C70 255 70 285 65 310 L100 310 C105 260 100 220 95 190 C90 150 85 130 70 120 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" filter="url(#cyanGlow)"/>

      <!-- Eyelash / Eye closed meditative glow -->
      <path d="M52 175 Q 60 178 68 175" stroke="#ffffff" stroke-width="2" fill="none"/>
      <!-- Soft lips glow -->
      <path d="M42 208 Q 50 210 58 208" stroke="#f43f5e" stroke-width="2.5" fill="none"/>
    </g>

    <!-- ================= 3D NEON "AI" ================= -->
    <g transform="translate(380, 240)">
      <!-- 3D Extrusion Back Layer -->
      <text x="20" y="195" font-family="'Outfit', sans-serif" font-size="205" font-weight="900" fill="#0284c7" opacity="0.6">AI</text>
      <!-- Glowing Face Layer -->
      <text x="0" y="180" font-family="'Outfit', sans-serif" font-size="205" font-weight="900" fill="url(#aiFaceGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#cyanGlow)">
        AI
      </text>

      <!-- Digital Microchip Circuit Traces Inside 'A' and 'I' -->
      <g stroke="#ffffff" stroke-width="2.5" opacity="0.85">
        <path d="M50 150 L65 110 L95 110 L110 80" fill="none"/>
        <circle cx="50" cy="150" r="3.5" fill="#38bdf8"/>
        <circle cx="110" cy="80" r="3.5" fill="#38bdf8"/>

        <path d="M190 70 L210 90 L210 130" fill="none"/>
        <circle cx="190" cy="70" r="3.5" fill="#d946ef"/>
        <circle cx="210" cy="130" r="3.5" fill="#d946ef"/>
      </g>

      <!-- Crown atop the "I" -->
      <g transform="translate(195, -55)">
        <polygon points="0,35 15,10 30,25 45,10 60,35" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pinkGlow)"/>
        <circle cx="0" cy="35" r="3" fill="#ffffff"/>
        <circle cx="15" cy="10" r="3" fill="#ffffff"/>
        <circle cx="45" cy="10" r="3" fill="#ffffff"/>
        <circle cx="60" cy="35" r="3" fill="#ffffff"/>
        <!-- Diamond Sparkles adjacent to crown -->
        <polygon points="90,15 95,28 108,33 95,38 90,51 85,38 72,33 85,28" fill="#fde047" filter="url(#ringGlow)"/>
        <polygon points="120,45 123,53 131,56 123,59 120,67 117,59 109,56 117,53" fill="#ffffff"/>
      </g>
    </g>

    <!-- ================= "CREATOR" WORDMARK (White Brush / Stencil) ================= -->
    <g transform="translate(500, 485)">
      <!-- Left & Right Motion Slash Accents -->
      <path d="M-240 -10 L-210 -25 M-250 5 L-220 -10" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M210 -25 L240 -10 M220 -10 L250 5" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>

      <text x="0" y="0" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="4" font-style="italic">
        CREATOR
      </text>
    </g>

    <!-- ================= "Khushi" (Glowing Script with Crown & Heart) ================= -->
    <g transform="translate(500, 615)">
      <!-- Mini Crown above Khushi -->
      <g transform="translate(-2, -85)">
        <polygon points="-16,14 -8,0 0,8 8,0 16,14" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#pinkGlow)"/>
      </g>

      <!-- Glowing Script "Khushi" -->
      <text x="0" y="0" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="130" font-weight="bold" fill="url(#khushiGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#pinkGlow)">
        Khushi
      </text>

      <!-- Elegant Under-Swirl Flourish -->
      <path d="M-130 18 Q 0 65 140 10 Q 180 -5 170 12 Q 155 30 120 28" fill="none" stroke="url(#khushiGrad)" stroke-width="6" stroke-linecap="round" filter="url(#cyanGlow)"/>

      <!-- Heart Symbol with Sparkles -->
      <g transform="translate(205, -35)">
        <path d="M12,21.35L10.55,20.03C5.4,15.36 2,12.28 2,8.5C2,5.42 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.09C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.42 22,8.5C22,12.28 18.6,15.36 13.45,20.04L12,21.35Z" fill="none" stroke="#ec4899" stroke-width="3" transform="scale(1.4) rotate(15)" filter="url(#pinkGlow)"/>
        <!-- Sparkle ticks -->
        <line x1="42" y1="-8" x2="52" y2="-15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="46" y1="10" x2="58" y2="10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ================= SUBTITLE: "♥ DREAM • CREATE • INSPIRE ♥" ================= -->
    <g transform="translate(500, 742)">
      <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="8">
        ♥  DREAM  •  CREATE  •  INSPIRE  ♥
      </text>
    </g>

    <!-- ================= 4 NEON SQUARE ICONS ROW ================= -->
    <g transform="translate(500, 800)">
      <!-- Flanking Divider Lines -->
      <line x1="-220" y1="0" x2="-160" y2="0" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
      <line x1="160" y1="0" x2="220" y2="0" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>

      <!-- Icon 1: Photo/Image (Pink) -->
      <g transform="translate(-135, -24)">
        <rect width="48" height="48" rx="10" fill="#130b24" stroke="#ec4899" stroke-width="3" filter="url(#pinkGlow)"/>
        <polygon points="12,34 22,22 30,30 36,25 42,34" fill="none" stroke="#ec4899" stroke-width="2.5"/>
        <circle cx="18" cy="18" r="3" fill="#ec4899"/>
      </g>

      <!-- Icon 2: Video Play (Cyan) -->
      <g transform="translate(-60, -24)">
        <rect width="48" height="48" rx="10" fill="#082236" stroke="#06b6d4" stroke-width="3" filter="url(#cyanGlow)"/>
        <polygon points="18,14 36,24 18,34" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linejoin="round"/>
        <line x1="8" y1="12" x2="40" y2="12" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3"/>
      </g>

      <!-- Icon 3: Art Palette (Pink) -->
      <g transform="translate(15, -24)">
        <rect width="48" height="48" rx="10" fill="#130b24" stroke="#ec4899" stroke-width="3" filter="url(#pinkGlow)"/>
        <path d="M12 24 C12 15 18 10 28 10 C38 10 42 16 42 24 C42 32 36 38 28 38 C24 38 22 36 22 33 C22 30 24 28 22 28 C20 28 12 30 12 24 Z" fill="none" stroke="#ec4899" stroke-width="2.5"/>
        <circle cx="20" cy="18" r="2.5" fill="#f43f5e"/>
        <circle cx="28" cy="15" r="2.5" fill="#38bdf8"/>
        <circle cx="35" cy="20" r="2.5" fill="#facc15"/>
      </g>

      <!-- Icon 4: AI Microchip (Cyan) -->
      <g transform="translate(90, -24)">
        <rect width="48" height="48" rx="10" fill="#082236" stroke="#06b6d4" stroke-width="3" filter="url(#cyanGlow)"/>
        <rect x="12" y="12" width="24" height="24" rx="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
        <text x="24" y="29" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#06b6d4">AI</text>
        <!-- Pins -->
        <line x1="18" y1="6" x2="18" y2="12" stroke="#06b6d4" stroke-width="2"/>
        <line x1="30" y1="6" x2="30" y2="12" stroke="#06b6d4" stroke-width="2"/>
        <line x1="18" y1="36" x2="18" y2="42" stroke="#06b6d4" stroke-width="2"/>
        <line x1="30" y1="36" x2="30" y2="42" stroke="#06b6d4" stroke-width="2"/>
        <line x1="6" y1="18" x2="12" y2="18" stroke="#06b6d4" stroke-width="2"/>
        <line x1="6" y1="30" x2="12" y2="30" stroke="#06b6d4" stroke-width="2"/>
        <line x1="36" y1="18" x2="42" y2="18" stroke="#06b6d4" stroke-width="2"/>
        <line x1="36" y1="30" x2="42" y2="30" stroke="#06b6d4" stroke-width="2"/>
      </g>
    </g>
  </g>

  <!-- ================= GLOWING NEON CIRCULAR RING ================= -->
  <!-- Ambient outer neon aura -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#neonRingGrad)" stroke-width="22" opacity="0.6" filter="url(#ringGlow)"/>
  <!-- Crisp high-intensity inner core ring -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#neonRingGrad)" stroke-width="12"/>
  <circle cx="500" cy="500" r="460" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
</svg>

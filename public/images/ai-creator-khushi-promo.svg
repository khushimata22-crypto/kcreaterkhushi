<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPromo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080612"/>
      <stop offset="35%" stop-color="#140d2b"/>
      <stop offset="70%" stop-color="#1f1145"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="pNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="promoSpotlight" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgPromo)"/>
  <rect width="1200" height="675" fill="url(#promoSpotlight)"/>

  <!-- Perspective Grid lines -->
  <g opacity="0.12" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="600" y1="350" x2="100" y2="675"/>
    <line x1="600" y1="350" x2="350" y2="675"/>
    <line x1="600" y1="350" x2="600" y2="675"/>
    <line x1="600" y1="350" x2="850" y2="675"/>
    <line x1="600" y1="350" x2="1100" y2="675"/>
  </g>

  <!-- Floating Creative Showcase Cards (Isometric 3D Layers) -->
  
  <!-- Back Card: Website & Landing Page Wireframe -->
  <g transform="translate(680, 80) rotate(5)" filter="url(#glowFilt)" opacity="0.95">
    <rect width="440" height="280" rx="16" fill="#130d2a" stroke="url(#pNeon)" stroke-width="2"/>
    <!-- Browser Header Bar -->
    <rect width="440" height="36" rx="16" fill="#1e143f"/>
    <circle cx="24" cy="18" r="5" fill="#ef4444"/>
    <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="18" r="5" fill="#10b981"/>
    <rect x="80" y="10" width="220" height="16" rx="6" fill="#2d1f5e"/>
    <!-- Mock Web Layout Elements -->
    <rect x="25" y="55" width="200" height="18" rx="4" fill="#c084fc"/>
    <rect x="25" y="82" width="260" height="10" rx="3" fill="#6d549e"/>
    <rect x="25" y="100" width="180" height="10" rx="3" fill="#6d549e" opacity="0.6"/>
    <!-- CTA Button Mock -->
    <rect x="25" y="125" width="110" height="32" rx="8" fill="url(#pGold)"/>
    <text x="80" y="146" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#000">EXPLORE NOW</text>
    <!-- Visual block in mock -->
    <rect x="260" y="55" width="150" height="130" rx="12" fill="url(#pNeon)" opacity="0.3"/>
    <!-- Stats Row in mock -->
    <rect x="25" y="200" width="115" height="55" rx="8" fill="#23174b"/>
    <rect x="155" y="200" width="115" height="55" rx="8" fill="#23174b"/>
    <rect x="285" y="200" width="125" height="55" rx="8" fill="#23174b"/>
  </g>

  <!-- Front Card: High-Impact Advertisement Creative -->
  <g transform="translate(560, 220) rotate(-4)" filter="url(#glowFilt)">
    <rect width="400" height="320" rx="20" fill="#170e33" stroke="url(#pGold)" stroke-width="2.5"/>
    <rect x="16" y="16" width="368" height="200" rx="14" fill="#25164d"/>
    <!-- Ad Creative Mock Graphics -->
    <circle cx="200" cy="116" r="65" fill="url(#pNeon)" opacity="0.8"/>
    <polygon points="200,60 235,145 165,145" fill="url(#pGold)"/>
    <text x="200" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="3">AI POWERED CAMPAIGN</text>
    
    <!-- Ad Card Footer Info -->
    <text x="25" y="250" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Creative Advertisement</text>
    <text x="25" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#a78bfa">High-Conversion Digital Marketing</text>
    <rect x="25" y="290" width="350" height="4" rx="2" fill="url(#pGold)"/>
  </g>

  <!-- Left Content Branding Block: AI CREATOR KHUSHI -->
  <g transform="translate(80, 160)">
    <!-- Brand Badge -->
    <rect width="210" height="36" rx="18" fill="rgba(147, 51, 234, 0.25)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#f59e0b"/>
    <text x="35" y="23" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#fde68a" letter-spacing="2">OFFICIAL PROMOTION</text>

    <!-- Headline -->
    <text x="0" y="95" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="1">
      AI CREATOR
    </text>
    <text x="0" y="150" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="url(#pGold)" letter-spacing="2">
      KHUSHI
    </text>
    
    <!-- Subhead -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
      Turn Your Ideas Into Powerful Digital Experiences
    </text>
    <text x="0" y="232" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#a78bfa" opacity="0.9">
      Advertisement · Landing Page · Website Design
    </text>

    <!-- Services Capsules Mock -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e143b" stroke="#7c3aed" stroke-width="1"/>
      <text x="72" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Ads Design</text>
      
      <rect x="155" y="0" width="165" height="34" rx="8" fill="#1e143b" stroke="#7c3aed" stroke-width="1"/>
      <text x="237" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Landing Pages</text>

      <rect x="330" y="0" width="145" height="34" rx="8" fill="#1e143b" stroke="#7c3aed" stroke-width="1"/>
      <text x="402" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Websites</text>
    </g>
  </g>

  <!-- Glowing Corner Sparks -->
  <polygon points="1120,60 1125,75 1140,80 1125,85 1120,100 1115,85 1100,80 1115,75" fill="#fde68a" filter="url(#glowFilt)"/>
  <polygon points="120,520 123,532 135,535 123,538 120,550 117,538 105,535 117,532" fill="#c084fc"/>
  <polygon points="530,90 533,98 542,101 533,104 530,112 527,104 518,101 527,98" fill="#60a5fa"/>
</svg>
